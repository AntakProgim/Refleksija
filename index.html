
<!DOCTYPE html>
<html lang="lt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mokytojo refleksijos pagalbininkas</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        @keyframes slideUp {
            from { transform: translateY(15px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        @keyframes scaleIn {
            from { transform: scale(0.98); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }
        @keyframes pulseSoft {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.8; }
        }
        .animate-fade-in { animation: fadeIn 0.4s ease-out forwards; }
        .animate-slide-up { animation: slideUp 0.5s ease-out forwards; }
        .animate-scale-in { animation: scaleIn 0.3s ease-out forwards; }
        .animate-pulse-soft { animation: pulseSoft 2s infinite ease-in-out; }
        
        @media print {
            @page {
                margin: 12mm 14mm;
                size: A4 portrait;
            }
            
            * {
                -webkit-print-color-adjust: exact !important;
                print-color-adjust: exact !important;
                color-adjust: exact !important;
            }

            html, body, #root, main {
                height: auto !important;
                min-height: 0 !important;
                overflow: visible !important;
                display: block !important;
                background: white !important;
                margin: 0 !important;
                padding: 0 !important;
                color: #0f172a !important;
            }

            .print\:hidden { 
                display: none !important; 
            }
            
            .print\:block {
                display: block !important;
            }

            .print\:flex {
                display: flex !important;
            }

            .print\:grid {
                display: grid !important;
            }

            /* Report container fit for A4 */
            .report-container {
                box-shadow: none !important;
                border: none !important;
                width: 100% !important;
                max-width: 100% !important;
                margin: 0 !important;
                padding: 0 !important;
                transform: none !important;
                animation: none !important;
                opacity: 1 !important;
                display: block !important;
                background: white !important;
            }

            /* Prevent break inside cards and sections */
            section, .report-section, .print-avoid-break {
                page-break-inside: avoid !important;
                break-inside: avoid !important;
                margin-bottom: 20px !important;
                display: block !important;
            }

            .print-page-break {
                page-break-before: always !important;
                break-before: always !important;
            }

            /* Ensure background colors on progress bars and badge pills are printed */
            .print-bg-emerald { background-color: #10b981 !important; }
            .print-bg-teal { background-color: #14b8a6 !important; }
            .print-bg-indigo { background-color: #6366f1 !important; }
            .print-bg-amber { background-color: #f59e0b !important; }
        }

        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: #f1f1f1;
            border-radius: 10px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 10px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }
    </style>
<script type="importmap">
{
  "imports": {
    "recharts": "https://esm.sh/recharts@^3.6.0",

    "react": "https://esm.sh/react@^19.2.3",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/"
  }
}
</script>
<link rel="stylesheet" href="/index.css">
</head>

    <div id="root"></div>

</body>
</html>
